<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>🥢</title>
<!-- 分享到微信 / 加到主屏幕时用的标题、描述、缩略图。preview.jpg 是整张地图的截图（带图钉和停车位）；
     微信卡片的缩略图取页面里第一张 300px 以上的图，所以 body 开头藏了一张。浏览器标签页图标直接用 🥢 emoji。 -->
<meta name="description" content="吃——啊呜啊呜">
<meta property="og:title" content="🥢">
<meta property="og:description" content="吃——啊呜啊呜">
<meta property="og:image" content="https://chinhoyiu749.github.io/oauaehxuwy/preview.jpg">
<meta property="og:url" content="https://chinhoyiu749.github.io/oauaehxuwy/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1f5c4e">
<meta name="apple-mobile-web-app-title" content="🥢">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥢</text></svg>">
<link rel="apple-touch-icon" href="preview.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2a26;
    --ink-soft: #5a6a65;
    --paper: #ffffff;
    --paper-2: #f2f5f3;
    --line: #d8e0dc;
    --restaurant: #1f5c4e;
    --parking: #d9a400;
    --parking-ink: #5d4600;
    --hot: #e0262c;
    --serif: "Noto Serif SC", "Songti SC", serif;
    --sans: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eef2f0;
      --ink-soft: #a3b0ab;
      --paper: #182522;
      --paper-2: #21302c;
      --line: #334441;
      --restaurant: #6fc2a9;
      --parking: #e8b931;
      --parking-ink: #f5dd8a;
      --hot: #ff5c61;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; }

  /* 餐厅标记 */
  .pin-restaurant {
    width: 34px; height: 34px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    background: var(--restaurant);
    border: 3px solid var(--paper);
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .pin-restaurant.active { background: #e2553a; }
  /* 停车点标记：平时黄色；选停车位模式下标红、放大 */
  .pin-parking {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--parking);
    color: #2b2100;
    font: 700 15px/26px var(--sans);
    text-align: center;
    border: 2px solid var(--paper);
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
  }
  .pin-parking.hot {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: #e0262c;
    color: #fff;
    font: 700 18px/30px var(--sans);
  }

  /* 底部面板（餐厅面板 #sheet 和选停车位面板 #pbar 共用） */
  #sheet, #pbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,.18);
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    max-height: 72vh;
    overflow-y: auto;
    transform: translateY(105%);
    transition: transform .28s ease;
    z-index: 1000;
  }
  #sheet.open, #pbar.open { transform: translateY(0); }
  #sheet.dragging, #pbar.dragging { transition: none; }   /* 手指拖的时候跟手，不要动画 */
  @media (prefers-reduced-motion: reduce) { #sheet, #pbar { transition: none; } }
  @media (min-width: 720px) {
    #sheet, #pbar { left: auto; right: 18px; bottom: 18px; width: 400px; border-radius: 18px; max-height: 80vh; }
  }
  .grip { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
  .close {
    position: absolute; top: 12px; right: 14px;
    width: 32px; height: 32px; border-radius: 50%;
    border: 0; background: var(--paper-2); color: var(--ink-soft);
    font-size: 18px; cursor: pointer;
  }
  h1 {
    font: 700 24px/1.25 var(--serif);
    margin: 0 44px 10px 0;
  }
  .comment {
    font: 500 17px/1.6 var(--serif);
    margin: 0 0 12px;
    padding-left: 12px;
    border-left: 3px solid var(--restaurant);
  }
  .info { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 16px; }

  .dest-title { font-size: 13px; color: var(--ink-soft); margin: 0 0 8px; }

  /* 餐厅面板里的「停车」按钮 */
  .parking-btn {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 11px 14px; margin: 0 0 16px;
    border: 1.5px solid var(--parking); border-radius: 12px;
    background: var(--paper); color: var(--ink);
    font: 500 15px/1.4 var(--sans);
    cursor: pointer;
  }
  .parking-btn .badge {
    flex: none; width: 28px; height: 28px; border-radius: 7px;
    background: var(--parking); color: #2b2100;
    font-weight: 700; font-size: 15px; line-height: 28px; text-align: center;
  }
  .parking-btn .sub { display: block; font-size: 13px; color: var(--ink-soft); }
  .parking-btn .chev { margin-left: auto; font-size: 20px; color: var(--ink-soft); }
  .parking-btn:disabled { cursor: default; border-color: var(--line); color: var(--ink-soft); }
  .parking-btn:disabled .badge { background: var(--line); color: var(--ink-soft); }
  .parking-btn:disabled .chev { display: none; }

  .nav { display: flex; gap: 10px; margin-top: 14px; }
  .nav a {
    flex: 1; text-align: center; text-decoration: none;
    padding: 13px 0; border-radius: 12px;
    font: 500 15px var(--sans);
    background: var(--restaurant); color: #fff;
  }
  .nav a.secondary { background: var(--paper-2); color: var(--ink); border: 1.5px solid var(--line); }
  .nav a:focus-visible, .parking-btn:focus-visible, .back:focus-visible, .close:focus-visible { outline: 3px solid var(--parking); outline-offset: 2px; }
  .leaflet-control-attribution { font-size: 10px; }

  /* 选停车位面板 */
  .back {
    position: absolute; top: 12px; right: 14px;
    height: 32px; padding: 0 12px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--paper-2); color: var(--ink);
    font: 500 13px var(--sans); cursor: pointer;
  }
  .pbar-head { display: flex; align-items: center; gap: 10px; margin: 0 80px 12px 0; }
  .pbar-head .badge {
    flex: none; width: 28px; height: 28px; border-radius: 7px;
    background: var(--hot); color: #fff;
    font-weight: 700; font-size: 15px; line-height: 28px; text-align: center;
  }
  .pbar-head h2 { font: 700 18px/1.3 var(--serif); margin: 0; }
  .pbar-head .sub { font-size: 13px; color: var(--ink-soft); }
  .hint {
    font-size: 14px; line-height: 1.6; color: var(--ink-soft);
    margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--paper-2);
  }
  .chosen { padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--hot); }
  .chosen .name { font: 700 17px/1.4 var(--serif); }
  .chosen .note { font-size: 13px; line-height: 1.5; color: var(--ink-soft); margin-top: 2px; }
  .chosen .meta { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .chosen .nav { margin-top: 10px; }

  /* 筛选按钮 */
  #filter {
    position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 1000;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
    font: 500 14px var(--sans); cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  #filter .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  #filter.on { border-color: var(--restaurant); }
  #filter.on .dot { background: #2fb37a; }
  #filter:focus-visible { outline: 3px solid var(--parking); outline-offset: 2px; }

  /* 营业状态 */
  .status { display: inline-block; font-size: 13px; padding: 3px 9px; border-radius: 999px; margin: 0 0 10px; }
  .status.open { background: rgba(47,179,122,.15); color: #1d7a52; }
  .status.closed { background: rgba(226,85,58,.14); color: #b8432c; }
  .status.unknown { background: var(--paper-2); color: var(--ink-soft); }
  @media (prefers-color-scheme: dark) {
    .status.open { color: #7fe0b4; }
    .status.closed { color: #ff9a85; }
  }
  .hours { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; white-space: pre-line; }
</style>
</head>
<body>
<img src="preview.jpg" alt="" width="1" height="1" style="position:absolute;opacity:0;pointer-events:none">
<div id="map" role="application" aria-label="地图"></div>
<button id="filter" aria-pressed="false" onclick="toggleFilter()"><span class="dot"></span><span id="filter-text">只看现在开门的</span></button>

<!-- 餐厅面板 -->
<section id="sheet" aria-live="polite">
  <div class="grip"></div>
  <button class="close" aria-label="关闭" onclick="closeSheet()">×</button>
  <h1 id="s-name"></h1>
  <span class="status" id="s-status"></span>
  <p class="comment" id="s-comment"></p>
  <p class="info" id="s-info"></p>
  <p class="hours" id="s-hours"></p>
  <button id="btn-parking" class="parking-btn" onclick="enterParking()">
    <span class="badge">P</span>
    <span>停车<span class="sub" id="s-parking-sub"></span></span>
    <span class="chev">›</span>
  </button>
  <p class="dest-title">直接导航到餐厅</p>
  <div class="nav">
    <a id="nav-google" target="_blank" rel="noopener">Google 地图</a>
    <a id="nav-apple" class="secondary" target="_blank" rel="noopener">Apple 地图</a>
  </div>
</section>

<!-- 选停车位面板：地图上停车点标红，点一个再出导航 -->
<section id="pbar" aria-live="polite">
  <div class="grip"></div>
  <button class="back" onclick="exitParking()">‹ 返回</button>
  <div class="pbar-head">
    <span class="badge">P</span>
    <span><h2>选停车位</h2><span class="sub" id="p-rest"></span></span>
  </div>
  <p class="hint" id="p-hint">点地图上红色的街道或 P 点，选你要停的位置</p>
  <div class="chosen" id="p-chosen" hidden>
    <div class="name" id="p-name"></div>
    <div class="note" id="p-note"></div>
    <div class="meta" id="p-meta"></div>
    <div class="nav">
      <a id="pnav-google" target="_blank" rel="noopener">Google 地图</a>
      <a id="pnav-apple" class="secondary" target="_blank" rel="noopener">Apple 地图</a>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script>
  const map = L.map('map', { zoomControl: false });
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const restaurantIcon = active => L.divIcon({
    className: '',
    html: `<div class="pin-restaurant${active ? ' active' : ''}"></div>`,
    iconSize: [34, 34], iconAnchor: [17, 34]
  });
  const parkingIcon = hot => L.divIcon({
    className: '',
    html: `<div class="pin-parking${hot ? ' hot' : ''}">P</div>`,
    iconSize: hot ? [34, 34] : [26, 26], iconAnchor: hot ? [17, 17] : [13, 13]
  });
  const HOT = '#e0262c', WARM = '#d9a400';   // 停车点颜色：选停车位模式 / 平时

  const data = window.RESTAURANTS || [];
  const areas = window.PARKING_AREAS || [];       // 按区域共用的停车位
  const RADIUS = window.PARKING_RADIUS || 500;    // 区域停车位离餐厅多少米以内才显示

  // ---- 营业时间 ----
  const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
  const DAY_CN = ['周日','周一','周二','周三','周四','周五','周六'];
  const TZ = 'Australia/Adelaide';
  function nowParts() {
    const f = new Intl.DateTimeFormat('en-AU', { timeZone: TZ, weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
    const o = {}; f.formatToParts(new Date()).forEach(x => o[x.type] = x.value);
    const day = DAYS.indexOf(o.weekday.toLowerCase().slice(0,3));
    return { day, mins: (parseInt(o.hour) % 24) * 60 + parseInt(o.minute) };
  }
  // "8:00-21:30, 17:00-22:00" -> [[480,1290],[1020,1320]]；跨夜 "17:00-01:00" 结束加 24h
  function parseRanges(str) {
    if (!str || /closed|休/.test(str)) return [];
    return str.split(',').map(x => x.trim()).filter(Boolean).map(seg => {
      const [a, b] = seg.split('-').map(t => { const [h, m] = t.trim().split(':').map(Number); return h * 60 + (m || 0); });
      return [a, b <= a ? b + 1440 : b];
    });
  }
  // 返回 { state: 'open'|'closed'|'unknown', text }
  function openStatus(r) {
    if (!r.hours) return { state: 'unknown', text: '没填营业时间' };
    const { day, mins } = nowParts();
    const today = parseRanges(r.hours[DAYS[day]]);
    const yday = parseRanges(r.hours[DAYS[(day + 6) % 7]]);
    const fmt = m => { m = m % 1440; return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`; };
    // 昨天跨夜还没结束
    for (const [a, b] of yday) if (b > 1440 && mins < b - 1440) return { state: 'open', text: `营业中，${fmt(b)} 关门` };
    for (const [a, b] of today) {
      if (mins >= a && mins < b) {
        const left = b - mins;
        return { state: 'open', text: left <= 60 ? `营业中，还有 ${left} 分钟关门` : `营业中，${fmt(b)} 关门` };
      }
      if (mins < a) return { state: 'closed', text: `还没开，${fmt(a)} 开门` };
    }
    return { state: 'closed', text: today.length ? '今天已关门' : '今天休息' };
  }
  function hoursText(r) {
    if (!r.hours) return '';
    return DAYS.map((d, i) => `${DAY_CN[i]}  ${r.hours[d] || '休息'}`).join('\n');
  }
  function isOpenNow(r) { return openStatus(r).state === 'open'; }

  let filterOn = false;
  function toggleFilter() {
    filterOn = !filterOn;
    const btn = document.getElementById('filter');
    btn.classList.toggle('on', filterOn);
    btn.setAttribute('aria-pressed', filterOn);
    applyFilter();
  }
  function applyFilter() {
    let shown = 0;
    markers.forEach((m, i) => {
      const show = !filterOn || isOpenNow(data[i]);
      if (show) { m.addTo(map); shown++; } else { m.remove(); }
    });
    document.getElementById('filter-text').textContent = filterOn ? `现在开门的：${shown} 家` : '只看现在开门的';
    if (filterOn && activeIdx !== null && !isOpenNow(data[activeIdx])) closeSheet();
  }
  setInterval(() => { if (filterOn) applyFilter(); if (activeIdx !== null) showStatus(data[activeIdx]); }, 60000);
  function showStatus(r) {
    const st = openStatus(r);
    const el = document.getElementById('s-status');
    el.className = 'status ' + st.state;
    el.textContent = st.text;
    document.getElementById('s-hours').textContent = hoursText(r);
  }
  const sheet = document.getElementById('sheet');
  const pbar = document.getElementById('pbar');
  const parkingLayer = L.layerGroup().addTo(map);   // 停车点（线和 P 点）
  const chosenLayer = L.layerGroup().addTo(map);    // 选中位置的红圈
  let markers = [], activeIdx = null, parkingMode = false;

  // 放餐厅标记
  data.forEach((r, i) => {
    const m = L.marker([r.lat, r.lng], { icon: restaurantIcon(false), title: r.name }).addTo(map);
    m.on('click', () => openRestaurant(i));
    markers.push(m);
  });
  if (data.length) {
    map.fitBounds(L.latLngBounds(data.map(r => [r.lat, r.lng])).pad(0.3), { maxZoom: 15 });
  } else {
    map.setView([-34.9285, 138.6007], 12);
  }

  function setNav(prefix, lat, lng, name) {
    const ll = `${lat},${lng}`;
    document.getElementById(prefix + '-google').href =
      `https://www.google.com/maps/dir/?api=1&destination=${ll}`;
    document.getElementById(prefix + '-apple').href =
      `https://maps.apple.com/?daddr=${ll}&q=${encodeURIComponent(name)}`;
  }

  // 把停车位画到地图上（餐厅自己的 + 附近的区域停车位），返回包含餐厅和所有停车位的范围。
  // hot=true 是选停车位模式：标红、放大。平时黄色；平时点到停车位也会直接进选停车位模式。
  function drawParking(r, hot) {
    parkingLayer.clearLayers();
    const bounds = L.latLngBounds([[r.lat, r.lng]]);
    const color = hot ? HOT : WARM;
    spotsFor(r).forEach(p => {
      if (p.type === 'street' && p.coords) {
        L.polyline(p.coords, { color, weight: hot ? 9 : 7, opacity: .85, interactive: false }).addTo(parkingLayer);
        // 叠一条透明的宽线接收点击，手指容易点中；点到哪里就吸到线上最近的点
        L.polyline(p.coords, { weight: 30, opacity: 0, bubblingMouseEvents: false })
          .on('click', e => pickParking(p, nearestOnStreet(p.coords, e.latlng)))
          .addTo(parkingLayer);
        p.coords.forEach(c => bounds.extend(c));
      } else {
        L.marker([p.lat, p.lng], { icon: parkingIcon(hot), title: p.name })
          .on('click', () => pickParking(p, L.latLng(p.lat, p.lng)))
          .addTo(parkingLayer);
        bounds.extend([p.lat, p.lng]);
      }
    });
    return bounds;
  }

  // 一条街（折线）上离 latlng 最近的点。用固定缩放级别投影，不依赖当前视图。
  function nearestOnStreet(coords, latlng) {
    const z = 18, p = map.project(latlng, z);
    let best = null, bestD = Infinity;
    for (let i = 0; i + 1 < coords.length; i++) {
      const q = L.LineUtil.closestPointOnSegment(p, map.project(coords[i], z), map.project(coords[i + 1], z));
      const d = p.distanceTo(q);
      if (d < bestD) { bestD = d; best = q; }
    }
    return best ? map.unproject(best, z) : L.latLng(coords[0]);
  }
  // 一个停车位离某个点多少米（街道按线上最近的点算）
  function distTo(p, from) {
    const ll = p.type === 'street' && p.coords ? nearestOnStreet(p.coords, from) : L.latLng(p.lat, p.lng);
    return from.distanceTo(ll);
  }
  // 这家餐厅能用的停车位：自己写的 parking，加上区域停车位里离餐厅不超过 RADIUS 米的
  function spotsFor(r) {
    const from = L.latLng(r.lat, r.lng);
    const list = (r.parking || []).map(p => Object.assign({}, p, { area: '' }));
    areas.forEach(a => (a.spots || []).forEach(p => {
      if (distTo(p, from) <= RADIUS) list.push(Object.assign({}, p, { area: a.area || '' }));
    }));
    return list;
  }

  function openRestaurant(i) {
    const r = data[i];
    activeIdx = i;
    parkingMode = false;
    pbar.classList.remove('open');
    chosenLayer.clearLayers();
    markers.forEach((m, k) => m.setIcon(restaurantIcon(k === i)));

    document.getElementById('s-name').textContent = r.name;
    document.getElementById('s-comment').textContent = r.comment || '';
    document.getElementById('s-info').textContent = r.info || '';
    showStatus(r);

    const bounds = drawParking(r, false);

    const n = spotsFor(r).length;
    document.getElementById('btn-parking').disabled = !n;
    document.getElementById('s-parking-sub').textContent = n ? `附近 ${n} 个停车位，在地图上选一个` : '附近没记停车位';

    setNav('nav', r.lat, r.lng, r.name);

    sheet.classList.add('open');
    map.fitBounds(bounds.pad(0.4), { maxZoom: 17, paddingBottomRight: [0, window.innerWidth < 720 ? 280 : 0] });
  }

  // 按「停车」：收起餐厅面板，停车点标红，等用户在地图上点
  function enterParking() {
    const r = data[activeIdx];
    if (!r || !spotsFor(r).length) return;
    parkingMode = true;
    markers.forEach(m => m.setIcon(restaurantIcon(false)));
    const bounds = drawParking(r, true);
    chosenLayer.clearLayers();
    document.getElementById('p-rest').textContent = r.name;
    document.getElementById('p-hint').hidden = false;
    document.getElementById('p-chosen').hidden = true;
    sheet.classList.remove('open');
    pbar.classList.add('open');
    map.fitBounds(bounds.pad(0.35), { maxZoom: 18, paddingBottomRight: [0, window.innerWidth < 720 ? 230 : 0] });
  }

  // 用户点了地图上的某个停车点 / 街道上的某个位置
  function pickParking(p, latlng) {
    if (!parkingMode) enterParking();
    chosenLayer.clearLayers();
    L.circleMarker(latlng, { radius: 22, color: HOT, weight: 4, fillColor: HOT, fillOpacity: .15, interactive: false }).addTo(chosenLayer);
    document.getElementById('p-name').textContent = p.name;
    document.getElementById('p-note').textContent = p.note || '';
    const r = data[activeIdx];
    const metres = Math.round(L.latLng(r.lat, r.lng).distanceTo(latlng) / 10) * 10;
    document.getElementById('p-meta').textContent = [p.area, `离餐厅约 ${metres} 米`].filter(Boolean).join(' · ');
    setNav('pnav', latlng.lat.toFixed(6), latlng.lng.toFixed(6), p.name);
    document.getElementById('p-hint').hidden = true;
    document.getElementById('p-chosen').hidden = false;
  }

  // 「返回」：回到餐厅面板，停车点变回黄色
  function exitParking() {
    parkingMode = false;
    pbar.classList.remove('open');
    chosenLayer.clearLayers();
    if (activeIdx === null) return;
    markers[activeIdx].setIcon(restaurantIcon(true));
    drawParking(data[activeIdx], false);
    sheet.classList.add('open');
  }

  function closeSheet() {
    sheet.classList.remove('open');
    pbar.classList.remove('open');
    parkingMode = false;
    parkingLayer.clearLayers();
    chosenLayer.clearLayers();
    markers.forEach(m => m.setIcon(restaurantIcon(false)));
    activeIdx = null;
  }
  // 选停车位模式下点空白地图不关面板，免得想点街道没点准就退出了
  map.on('click', () => { if (!parkingMode) closeSheet(); });

  // 手机上下拉面板：内容滚到顶的时候往下拉，面板跟着手指走，拉过 90px 松手就关掉，不够就弹回去。
  // 往上滑或者内容还没滚到顶，都交给正常滚动。
  function makeDraggable(panel, onDismiss) {
    let y0 = null, dy = 0, dragging = false;
    panel.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      y0 = e.touches[0].clientY; dy = 0; dragging = false;
    }, { passive: true });
    panel.addEventListener('touchmove', e => {
      if (y0 === null || e.touches.length !== 1) return;
      const y = e.touches[0].clientY, d = y - y0;
      if (!dragging) {
        if (d > 8 && panel.scrollTop <= 0) { dragging = true; y0 = y; panel.classList.add('dragging'); }
        else if (d < -8) { y0 = null; }   // 往上滑：不管
        return;
      }
      dy = Math.max(0, y - y0);
      panel.style.transform = `translateY(${dy}px)`;
      e.preventDefault();
    }, { passive: false });
    const end = () => {
      if (y0 === null && !dragging) return;
      y0 = null;
      panel.classList.remove('dragging');
      panel.style.transform = '';
      if (dragging && dy > 90) onDismiss();
      dragging = false; dy = 0;
    };
    panel.addEventListener('touchend', end);
    panel.addEventListener('touchcancel', end);
  }
  makeDraggable(sheet, closeSheet);
  makeDraggable(pbar, exitParking);

  // iPhone 上把 Apple 地图放前面（两个面板的导航按钮都换）
  if (/iPhone|iPad/.test(navigator.userAgent)) {
    document.querySelectorAll('.nav').forEach(nav => {
      const g = nav.querySelector('[id$="-google"]'), a = nav.querySelector('[id$="-apple"]');
      nav.appendChild(g);
      a.classList.remove('secondary');
      g.classList.add('secondary');
    });
  }
</script>
</body>
</html>
